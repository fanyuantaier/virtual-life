<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>她的朋友圈</title>
<style>
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif;
         background:linear-gradient(160deg,#f5f1e8,#e8e2d5); min-height:100vh; margin:0; }
  header { background:rgba(255,255,255,.75); padding:16px 24px; border-bottom:1px solid #d8d0bf;
           display:flex; align-items:center; gap:12px; }
  header a { color:#7ba05b; text-decoration:none; font-size:14px; margin-left:auto; }
  header h1 { font-size:18px; color:#3d3a32; }
  #feed { max-width:520px; margin:24px auto; }
  .moment { background:white; border:1px solid #e0d9c8; border-radius:12px;
            padding:14px 18px; margin-bottom:14px; }
  .moment .when { font-size:12px; color:#999; margin-bottom:6px; }
  .moment .text { font-size:14px; line-height:1.7; color:#3d3a32; }
</style>
</head>
<body>
<header><h1>她的朋友圈</h1><a href="/">← 回聊天</a></header>
<div id="feed">加载中…</div>
<script>
fetch('/api/moments').then(r=>r.json()).then(ms=>{
  const feed = document.getElementById('feed');
  if (!ms.length) { feed.innerHTML = '<p style="text-align:center;color:#999">还没有动态</p>'; return; }
  ms.forEach(m => {
    const d = document.createElement('div');
    d.className = 'moment';
    d.innerHTML = '<div class="when">' + m.when + '</div><div class="text">' + m.text + '</div>';
    feed.appendChild(d);
  });
});
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-life"
version = "1.0.0"
description = "数字人格引擎：AI 从出生开始活一遍——导演架构生成不可预测事件，艾宾浩斯分级遗忘，人格由经历沉淀"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "fanyuantaier"}]
requires-python = ">=3.10"
keywords = ["ai-companion", "digital-persona", "life-simulation", "memory", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/fanyuantaier/virtual-life"
Repository = "https://github.com/fanyuantaier/virtual-life"
Issues = "https://github.com/fanyuantaier/virtual-life/issues"

[tool.setuptools]
packages = [
    "engine",
    "memory",
    "world",
    "harness",
    "reality",
    "scheduler",
    "web",
]
py-modules = [
    "config", "contracts", "chat", "adult", "daemon", "life",
    "llm", "main", "protagonist", "relation", "start", "burn_night",
    "weekly_report",
]

[tool.setuptools.package-data]
web = ["*.html"]
